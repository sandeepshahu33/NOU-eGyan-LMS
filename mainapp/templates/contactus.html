{% extends 'base.html' %}

{% block main %}
<h1 class="text-center text-primary">Enquiry Form </h1>
{% if messages %}
{% for m in messages %}
<div class="alert alert-warning alert-dismissible fade show" role="alert">
    {{m}}
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
</div>
{% endfor %}
{% endif %}
<form action="" class="form-group" method="post">
    {% csrf_token %}
    <table class="table" style="margin:auto; width:60%;">
        <tr>
            <td>Enter Name</td>
            <td><input type="text" name="name" class="form-control" required></td>
        </tr>
        <tr>
            <td>Select Gender</td>
            <td><input type="radio" name="gender" value="Male" class="form-chech-input" required>Male
                <input type="radio" name="gender" value="Female" class="form-chech-input" required>Female
            </td>
        </tr>
        <tr>
            <td>Enter Address</td>
            <td><textarea name="address" id="" class="form-control" required></textarea></td>
        </tr>
        <tr>
            <td>Enter Contact No</td>
            <td><input type="number" name="contactno" class="form-control" required></td>
        </tr>
        <tr>
            <td>Enter Email Address</td>
            <td><input type="email" name="emailaddress" class="form-control" required></td>
        </tr>
        <tr>
            <td>Enter Enquiry Text</td>
            <td><textarea name="enquirytext" id="" class="form-control" required></textarea></td>
        </tr>
        <tr>
            <td></td>
            <td>
                <button type="submit" class="bg-success btn text-light">Submit</button>
            </td>
        </tr>
    </table>
</form>
{% endblock main %}
