{% extends 'base1.html' %}

{% load static %}


{% block main %}
<div class="container-fluid p-0 ">
    <!-- Background image start -->

    <div class="row  ">
        <div class="col-sm-12 contact-bg-img1">
            <div class="row pt-4">
                <div class="col-sm-9 mx-auto">
                    <h3 class="text-light">Login</h3>
                    <p class="text-light"> <a href="/" class="text-warning">Home</a> / Login</p>
                </div>
            </div>
        </div>
    </div>
    <!-- Background image end -->

    <div class="row">
        <div class="col-sm-12 bg-img2 mt-3">
            <div class="row mt-3">
                <div class="col-sm-9 mx-auto">
                    <h3 class=" text-center"><span class="text-maroon">Login Here</span></h3>
                </div>
            </div>
        
            {% if messages %}
            {% for m in messages %}
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}

            <form action="" class="form-group" method="post">
                {% csrf_token %}
                <table class="table" style="margin:auto; width:60%;">
                    <tr>
                        <td>Enter User Name</td>
                        <td><input type="text" name="username" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td>Enter Password</td>
                        <td><input type="Password" name="password" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <button type="submit" class="btn bg-maroon text-light">Login</button>
                        </td>
                    </tr>
                </table>
            </form>

        </div>
    </div>



</div>

{% endblock main %}
