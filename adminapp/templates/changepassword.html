{% extends 'adminbase.html' %}
{% load static %}
{% block admin %}
<div class="container">
    <div class="row bg-primary text-light p-3" style="border-radius: 20px">
        <div class="col-sm-12">
            <h3 class="text-light mb-0 text-center">Change Password</h3>

        </div>
    </div>
    <div class="row">
        <div class="col-sm-12">
            {% if messages %}
            {% for m in messages %}
            <div class="alert alert-warning alert-dismissible fade show" role="alert">
                {{m}}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            {% endfor %}
            {% endif %}
            <form action="" class="form-group" method="post">
                {% csrf_token %}
                <table class="table" style="margin:auto; width:60%;">
                    <tr>
                        <td>Enter Old Password</td>
                        <td><input type="password" name="oldpassword" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td>Enter New Password</td>
                        <td><input type="password" name="newpassword" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td>Confirm Password</td>
                        <td><input type="password" name="confirmpassword" class="form-control" required></td>
                    </tr>
                    <tr>
                        <td></td>
                        <td>
                            <button type="submit" class="bg-success btn text-light">Change Password</button>
                        </td>
                    </tr>
                </table>
            </form>
        </div>
    </div>

</div>
{% endblock %}
